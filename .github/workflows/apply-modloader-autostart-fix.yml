name: Apply ModLoader Autostart Fix

on:
  push:
    branches:
      - agent/modloader-autostart-fix-v2
    paths:
      - .github/workflows/apply-modloader-autostart-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated source patches onto main
        shell: pwsh
        run: |
          $patchDir = Join-Path $env:RUNNER_TEMP 'modloader-patches'
          New-Item -ItemType Directory -Force $patchDir | Out-Null
          Copy-Item '.github\patches\*.patch' $patchDir

          git fetch origin main
          git checkout -B modloader-publish origin/main

          Get-ChildItem $patchDir -Filter '*.patch' | Sort-Object Name | ForEach-Object {
            Write-Host "Applying $($_.Name)"
            git apply -p2 --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch check failed: $($_.Name)" }
            git apply -p2 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch apply failed: $($_.Name)" }
          }

          Copy-Item 'database_mods\cheatSetting.dat' 'mods\cheat_shop\cheatSetting.dat' -Force
          Copy-Item 'database_mods\wish.dat' 'mods\dark_assembly\wish.dat' -Force

      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Expose MinGW to PowerShell
        shell: pwsh
        run: |
          'C:\msys64\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build loader, actions, and installer
        shell: pwsh
        run: |
          $gxx = (Get-Command g++.exe -ErrorAction Stop).Source

          & $gxx -std=c++17 -O2 -s -static-libgcc -static-libstdc++ `
            'mods\cheat_shop\apply_cheat_shop.cpp' `
            -o 'mods\cheat_shop\APLICAR_MOD_CHEAT_SHOP.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to build Cheat Shop action' }

          & $gxx -std=c++17 -O2 -s -static-libgcc -static-libstdc++ `
            'mods\dark_assembly\apply_dark_assembly.cpp' `
            -o 'mods\dark_assembly\APLICAR_MOD_DARK_ASSEMBLY.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to build Dark Assembly action' }

          & $gxx -std=c++17 -O2 -s -static-libgcc -static-libstdc++ `
            'INSTALAR_MOD.cpp' -o 'INSTALAR_MOD.exe' -lpsapi
          if ($LASTEXITCODE -ne 0) { throw 'Failed to build installer' }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'native\mod_menu_overlay\build.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to build Mod Menu overlay' }

      - name: Verify and publish to main
        shell: pwsh
        run: |
          $required = @(
            'dxgi.dll',
            'INSTALAR_MOD.exe',
            'mods\native\DisgaeaMayhemModMenu.dll',
            'native\mod_menu_overlay\build\DisgaeaMayhemModMenu.dll',
            'mods\cheat_shop\APLICAR_MOD_CHEAT_SHOP.exe',
            'mods\cheat_shop\cheatSetting.dat',
            'mods\dark_assembly\APLICAR_MOD_DARK_ASSEMBLY.exe',
            'mods\dark_assembly\wish.dat'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required artifact missing: $path"
            }
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- `
            'INSTALAR_MOD.cpp' 'INSTALAR_MOD.exe' 'dxgi.dll' `
            'mods/cheat_shop' 'mods/dark_assembly' 'mods/dlc_unlocker/mod.json' `
            'mods/native/DisgaeaMayhemModMenu.dll' `
            'native/mod_menu_overlay/build.ps1' `
            'native/mod_menu_overlay/mod_menu_overlay.cpp' `
            'native/mod_menu_overlay/build/DisgaeaMayhemModMenu.dll'

          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          if (git diff --cached --quiet) { throw 'No changes staged for publication' }

          git commit -m 'fix(modloader): make startup deterministic and auto-apply mods'
          git push origin HEAD:main
